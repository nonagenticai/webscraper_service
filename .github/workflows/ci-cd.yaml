---
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: nonagenticai/gitops-production/.github/workflows/python-service.yml@main
    with:
      image_name: webscraper_service
      src_dir: src
      # --skip-editable: webscraper-service is installed editably via uv
      # sync and not on PyPI, so pip-audit can't audit it. Skip the
      # editable self-install rather than fail.
      # (CVE-2026-106454 twisted IMAP4 ReDoS ignore removed 2026-11-04: fixed in
      # twisted 26.10.0, now locked; pip-audit is clean without it.)
      # (Removed 2026-10-21: CVE-2026-42304 -- fixed by twisted 26.4.0, now
      # locked; PYSEC-2017-83 -- no longer reported against scrapy 2.19.0.)
      # (pyjwt PYSEC-2025-183 + joblib/nltk are handled by the archetype
      # FLEET_IGNORES register — no per-repo entry needed.)
      pip_audit_ignores: "--skip-editable"
      # This is the playwright+chromium case the archetype documents: a
      # multi-GB multi-stage image whose builder-stage layers (apt + uv sync +
      # `playwright install chromium`) are DISCARDED, so the default inline
      # cache cannot carry them. Without it every merge rebuilt them from
      # scratch — an 18-19 min build, a fresh digest for identical source, and
      # a full multi-GB node pull on a replicas:1 service.
      registry_build_cache: true
      # The archetype's default 30 CANCELLED this job three times in a row on
      # 2026-08-04 (run 30915852709 attempts 1-3, killed at 30m23s / 30m24s /
      # 30m25s — three kills within 2s of each other is a timeout cap, not a
      # flake). Attempt 4 then passed in 13m43s only because the three dead
      # attempts had progressively warmed the registry build cache.
      #
      # The cause is NOT registry contention (an earlier note here said it was;
      # that was measured and disproven on 2026-08-04). worker3's registry
      # serves 46 MB/s single-stream and ~80 MB/s aggregate. The real limit is
      # that the ARC runners schedule onto worker2 (mf1), which sits behind a
      # RESIDENTIAL uplink: worker2 -> registry measures 1.35 MB/s single and
      # ~2.7 MB/s aggregate, a ~30x gap vs the datacenter nodes. buildkit pushes
      # many layers concurrently across several concurrent runners, so per-layer
      # throughput divides down to the 63-75 KB/s seen in the logs (attempt 3:
      # two cache layers took 629.4s and 1017.2s while every other layer took
      # under 0.4s).
      #
      # A dependency bump busts the venv layer, so every bump pays the FULL
      # multi-GB push over that uplink instead of a cache hit — which is why a
      # routine fleet-wide dependency sweep tipped this job over the cap.
      # Measured need on a cache-cold build is ~45-50 min; per the archetype's
      # own guidance ("size this ABOVE the derived budget, not at it") this is
      # set to 60 to leave headroom for a variable domestic uplink. A job killed
      # by timeout-minutes reports a grey `cancelled`, indistinguishable from a
      # concurrency cancellation, which is how this stayed invisible.
      build_timeout_minutes: 60
      # auto-roll on merge: archetype drives flux-rollout-wait.
      # 25 (the default) is flux-rollout-wait's OWN worst-case budget with no
      # headroom for the node pull that has to happen first. The 2026-07-19
      # merge promoted correctly and was then killed mid-wait, reporting
      # `cancelled` for a deploy that had in fact succeeded — and the rerun
      # that provoked rolled a second digest for the same commit.
      deploy_timeout_minutes: 45
      deploy_namespace: webscraper
      deploy_name: webscraper
    secrets: inherit
